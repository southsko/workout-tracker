<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Joey — Workout History</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171c">
<style>
  :root{
    --bg:#14171c; --surface:#1d2128; --surface2:#232832; --line:#2b313a;
    --text:#e9ebee; --muted:#8b929e; --accent:#ffb020; --done:#3ecf6a; --danger:#e5484d;
    --radius:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.35;}
  body{padding:0 0 40px; max-width:560px; margin:0 auto;}
  .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
  a.back{color:var(--muted); text-decoration:none; font-size:.8rem;}

  header{padding:14px 16px 12px; border-bottom:1px solid var(--line);}
  .hdrtop{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .title{display:flex; align-items:baseline; gap:8px; margin-top:6px;}
  .title h1{margin:0; font-size:20px; letter-spacing:.02em; font-weight:800;}
  .title .tag{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:#14171c; background:var(--accent); padding:3px 7px; border-radius:5px;}
  .who{font-size:11.5px; color:var(--muted);}

  main{padding:0 16px;}

  .gate{margin-top:20px; padding:24px 18px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); text-align:center; color:var(--muted); font-size:13.5px;}
  .gate a{color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent);}

  .controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; align-items:center;}
  select{background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:8px;
    padding:9px 10px; font-size:13.5px; flex:1; min-width:160px;}
  .btn{border:none; border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer;
    text-decoration:none; display:inline-block;}
  .btn.primary{background:var(--accent); color:#14171c;}

  .chartwrap{margin-top:16px; padding:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); height:280px; position:relative;}
  .chartwrap canvas{width:100% !important; height:calc(100% - 22px) !important;}
  .charttitle{font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:6px;
    letter-spacing:.03em;}
  .charttitle b{color:var(--text);}

  table{width:100%; border-collapse:collapse; margin-top:16px; font-size:13px;}
  th{text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    padding:8px 8px; border-bottom:1px solid var(--line);}
  td{padding:9px 8px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  td.empty{text-align:center; color:var(--muted); padding:24px 8px;}
</style>
</head>
<body>
<header>
  <div class="hdrtop">
    <a class="back" href="index.html">← Workout 3.0</a>
    <span class="who" id="whoami"></span>
  </div>
  <div class="title"><h1>History</h1><span class="tag">Weight log</span></div>
</header>

<main>
  <div class="gate" id="gate" hidden>Sign in with Google on the <a href="index.html">tracker page</a> to see your weight history.</div>

  <div id="content" hidden>
    <div class="controls">
      <select id="exerciseFilter"></select>
      <button class="btn primary" id="exportBtn">Export CSV</button>
    </div>

    <div class="chartwrap" id="chartWrap" hidden>
      <div class="charttitle" id="chartTitle"></div>
      <canvas id="chart"></canvas>
    </div>

    <table>
      <thead><tr><th>Date</th><th>Day</th><th>Exercise</th><th>Weight</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="drive-sync.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
let allRows = [];
let chart = null;

async function seedHistoryFromMigrationOrDefault(){
  const migration = await migrationSeed();
  if(migration && Array.isArray(migration.history)) return migration.history;
  return [];
}
function csvEscape(v){
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function exportCsv(){
  const header = ["date", "day", "exercise", "weight"];
  const lines = [header.join(",")].concat(
    allRows.map(r => [r.date, r.day_name, r.exercise_name, r.weight || ""].map(csvEscape).join(","))
  );
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "workout-history.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function populateExerciseFilter(rows){
  const names = [...new Set(rows.map(r => r.exercise_name))].sort();
  const sel = document.getElementById("exerciseFilter");
  sel.innerHTML = `<option value="">All exercises</option>` + names.map(n => `<option value="${n}">${n}</option>`).join("");
}

function renderTable(rows){
  const tbody = document.getElementById("tableBody");
  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="4" class="empty">No history yet — log a weight on the tracker.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.slice().reverse().map(r => `
    <tr><td>${r.date}</td><td>${r.day_name}</td><td>${r.exercise_name}</td><td class="num">${r.weight ? r.weight + " lb" : "—"}</td></tr>
  `).join("");
}

function pickDefaultExercise(rows){
  const counts = {};
  rows.forEach(r => { if(r.weight) counts[r.exercise_name] = (counts[r.exercise_name] || 0) + 1; });
  let best = null, bestCount = 0;
  for(const [name, count] of Object.entries(counts)){
    if(count > bestCount){ best = name; bestCount = count; }
  }
  return best;
}

function renderChart(rows, exerciseName){
  const wrap = document.getElementById("chartWrap");
  if(!exerciseName){
    wrap.hidden = true;
    return;
  }
  const filtered = rows.filter(r => r.exercise_name === exerciseName && r.weight);
  if(filtered.length === 0){
    wrap.hidden = true;
    return;
  }
  wrap.hidden = false;
  document.getElementById("chartTitle").innerHTML = `<b>${exerciseName}</b> — weight over time`;
  const labels = filtered.map(r => r.date);
  const data = filtered.map(r => parseFloat(r.weight));
  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels, datasets: [{
      label: exerciseName,
      data,
      borderColor: "#ffb020",
      backgroundColor: "rgba(255,176,32,.15)",
      borderWidth: 2.5,
      tension: .3,
      spanGaps: true,
      pointRadius: 4,
      pointHoverRadius: 6,
      pointBackgroundColor: "#ffb020",
      pointBorderColor: "#14171c",
      pointBorderWidth: 1.5,
      fill: true,
    }]},
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y} lb` } },
      },
      scales: {
        x: { ticks: { color: "#8b929e", maxRotation: 0, autoSkip: true }, grid: { color: "#2b313a" } },
        y: { ticks: { color: "#8b929e", callback: (v) => v + " lb" }, grid: { color: "#2b313a" } },
      },
    },
  });
}

async function onAuthChanged(){
  const user = driveUser();
  if(!user){
    document.getElementById("gate").hidden = false;
    document.getElementById("content").hidden = true;
    return;
  }
  let rows;
  try{
    const res = await getJsonFile(HISTORY_FILE, seedHistoryFromMigrationOrDefault);
    rows = res.data;
  }catch(e){
    document.getElementById("gate").hidden = false;
    document.getElementById("content").hidden = true;
    return;
  }
  document.getElementById("gate").hidden = true;
  document.getElementById("content").hidden = false;
  document.getElementById("whoami").textContent = user.email;

  allRows = rows;
  populateExerciseFilter(allRows);

  const defaultExercise = pickDefaultExercise(allRows);
  if(defaultExercise){
    document.getElementById("exerciseFilter").value = defaultExercise;
    renderTable(allRows.filter(r => r.exercise_name === defaultExercise));
    renderChart(allRows, defaultExercise);
  }else{
    renderTable(allRows);
  }

  document.getElementById("exerciseFilter").addEventListener("change", (ev) => {
    const val = ev.target.value;
    renderTable(val ? allRows.filter(r => r.exercise_name === val) : allRows);
    renderChart(allRows, val);
  });
  document.getElementById("exportBtn").addEventListener("click", exportCsv);
}
initAuth(onAuthChanged);
</script>
</body>
</html>
